name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run web:build
        env:
          EXPO_BASE_URL: /discipline

      - name: Fix asset paths for GitHub Pages subdirectory
        run: |
          sed -i 's|href="/_expo/|href="/discipline/_expo/|g; s|src="/_expo/|src="/discipline/_expo/|g; s|href="/favicon.ico"|href="/discipline/favicon.ico"|g' dist/index.html
          cp dist/index.html dist/404.html
          # GitHub Pages runs Jekyll by default, which ignores _ prefixed dirs
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
